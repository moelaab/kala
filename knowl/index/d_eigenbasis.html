<article class="definition definition-like"><h4 class="heading">
<span class="type">Definition</span><span class="space"> </span><span class="codenumber">4.5.3</span><span class="period">.</span><span class="space"> </span><span class="title">Eigenbasis.</span>
</h4>
<div class="para">Let <span class="process-math">\(T\colon V\rightarrow V\)</span> be a linear transformation. An ordered basis <span class="process-math">\(B=(\boldv_1, \boldv_2,\dots, \boldv_n)\)</span> is an <dfn class="terminology">eigenbasis</dfn> of <span class="process-math">\(T\)</span> if <span class="process-math">\(\boldv_j\)</span> is an eigenvector of <span class="process-math">\(T\)</span> for all <span class="process-math">\(1\leq j\leq n\text{.}\)</span>
</div></article><span class="incontext"><a class="internal" href="s_diagonalization.html#d_eigenbasis">in-context</a></span>
